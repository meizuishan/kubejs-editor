plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.12.1'
group = 'dev.kubejseditor'
base { archivesName = 'kubejs-editor' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets { integration { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
sourceSets.main.java { include 'dev/kubejseditor/**' }
sourceSets.main.resources.exclude 'kubejsrecipeeditor/**', 'assets/kubejsrecipeeditor/**'
repositories {
    mavenCentral()
    maven { url = 'https://maven.latvian.dev/releases'; content { includeGroup 'dev.latvian.mods' } }
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
neoForge {
    version = providers.gradleProperty('neoForgeVersion').getOrElse('21.1.251')
    parchment { minecraftVersion = '1.21.1'; mappingsVersion = '2024.11.17' }
    runs {
        client { client(); gameDirectory = file(project.findProperty('clientDir') ?: 'run-client'); if(project.hasProperty('verifyClient')){ systemProperty 'kubejs.editor.verifyClient','true'; programArguments.addAll '--width','1600','--height','900' }; if(project.hasProperty('verifyTypes')){systemProperty 'kubejs.editor.verifyTypes','true';programArguments.addAll '--width','1600','--height','900'}; if(project.hasProperty('verifyCanvas')){systemProperty 'kubejs.editor.verifyCanvas','true';programArguments.addAll '--width','1600','--height','900'}; if(project.hasProperty('verifyUndo')){systemProperty 'kubejs.editor.verifyUndo','true';programArguments.addAll '--width','1600','--height','900'}; if(project.hasProperty('verifyReloadResilience')){systemProperty 'kubejs.editor.verifyReloadResilience','true';programArguments.addAll '--width','1600','--height','900'}; if(project.hasProperty('verifyPackRevoke')){systemProperty 'kubejs.editor.verifyPackRevoke','true';programArguments.addAll '--width','1600','--height','900'} }
        server { server(); gameDirectory = file(project.findProperty('serverDir') ?: 'run-server'); programArgument '--nogui'; systemProperty 'kubejs.editor.verify', 'true' }
        client { if(project.hasProperty('verifyVintage')){systemProperty 'kubejs.editor.verifyVintage','true';programArguments.addAll '--width','1600','--height','900'} }
        gameTestServer { type = 'gameTestServer'; gameDirectory = file('run-gametest') }
        configureEach { systemProperty 'neoforge.enabledGameTestNamespaces', 'kubejs_editor' }
        client { if(project.hasProperty('verifyFan')){systemProperty 'kubejs.editor.verifyFan','true';programArguments.addAll '--width','1600','--height','900'} }
        client { if(project.hasProperty('verifyQuick')){systemProperty 'kubejs.editor.verifyQuick','true';programArguments.addAll '--width','1600','--height','900'} }
        client { if(project.hasProperty('verifyCompatibility')){systemProperty 'kubejs.editor.verifyCompatibility','true';systemProperty 'kubejs.editor.compatProfile',providers.gradleProperty('compatProfile').getOrElse('full');programArguments.addAll '--width','1600','--height','900'} }
        client { if(project.hasProperty('verifyTemplates')){systemProperty 'kubejs.editor.verifyTemplates','true';programArguments.addAll '--width','1600','--height','900'} }
        client { if(project.hasProperty('verifyAuthoring')){systemProperty 'kubejs.editor.verifyAuthoring','true';programArguments.addAll '--width','1600','--height','900'} }
        client { if(project.hasProperty('verifyContentLayout')){systemProperty 'kubejs.editor.verifyContentLayout','true';programArguments.addAll '--width','1600','--height','900'} }
        client { if(project.hasProperty('verifyContent')){systemProperty 'kubejs.editor.verifyContent','true';programArguments.addAll '--width','1600','--height','900'} }
        client { if(project.hasProperty('verifyBlocks')){systemProperty 'kubejs.editor.verifyBlocks','true';programArguments.addAll '--width','1600','--height','900'} }
        client { if(project.hasProperty('verifySimple')){systemProperty 'kubejs.editor.verifySimple','true';programArguments.addAll '--width','1600','--height','900'}; if(project.hasProperty('clientHeap')){jvmArgument '-Xmx'+project.property('clientHeap')} }
        client { if(project.hasProperty('verifyPackStartup')){systemProperty 'kubejs.editor.verifyPackStartup','true';programArguments.addAll '--width','1280','--height','720'} }
        client { if(project.hasProperty('researchPack')){systemProperty 'kubejs.editor.researchPack','true';programArguments.addAll '--width','1280','--height','720'} }
    }
    mods { kubejs_editor { sourceSet sourceSets.main }; kubejs_editor_verification { sourceSet sourceSets.integration } }
}
configurations { editorLibraries; editorIntegrations; localRuntime; implementation.extendsFrom editorLibraries; localRuntime.extendsFrom editorIntegrations; runtimeClasspath.extendsFrom localRuntime }
def compatibilityProfile = providers.gradleProperty('compatProfile').getOrElse('core')
if (!(compatibilityProfile in ['core','create','dragons','vintage','full'])) throw new GradleException('Unknown compatProfile: ' + compatibilityProfile)
def pinnedDependencies = new groovy.json.JsonSlurper().parse(file('dependencies.lock.json'))
def compatibilityVersions = new groovy.json.JsonSlurper().parse(file('compatibility-versions.lock.json'))
def requestedDependencies = pinnedDependencies.findAll { entry ->
    entry.target in ['libs/kubejs.jar','libs/rhino.jar','libs/jei.jar'] ||
    (compatibilityProfile != 'core' && entry.target == 'libs/create.jar') ||
    (compatibilityProfile == 'dragons' && entry.target.contains('DragonsPlus')) ||
    (compatibilityProfile == 'vintage' && (entry.target == 'libs/kubejs-create.jar' || entry.target.contains('createvintage'))) || compatibilityProfile == 'full'
}
if(project.hasProperty('jeiVersion')){
    def requestedJei=project.property('jeiVersion').toString()
    if(!compatibilityVersions.jei.containsKey(requestedJei))throw new GradleException('JEI verification version is not pinned: '+requestedJei)
    requestedDependencies=requestedDependencies.collect { entry ->
        if(entry.target!='libs/jei.jar')return entry
        def alternate=new LinkedHashMap(entry);alternate.coordinate='mezz.jei:jei-1.21.1-neoforge:'+requestedJei;alternate.publicSha256=compatibilityVersions.jei[requestedJei];return alternate
    }
}
dependencies {
    testImplementation 'com.google.code.gson:gson:2.10.1'
    requestedDependencies.each { entry -> add(entry.target in ['libs/kubejs.jar','libs/rhino.jar','libs/jei.jar'] ? 'editorLibraries' : 'editorIntegrations', entry.coordinate + '@jar') { transitive = false } }
}

tasks.register('verifyPinnedDependencies') {
    doLast {
        def artifacts = (configurations.editorLibraries.resolvedConfiguration.resolvedArtifacts + configurations.editorIntegrations.resolvedConfiguration.resolvedArtifacts)
        def report = requestedDependencies.collect { expected ->
            def artifact = artifacts.find { it.moduleVersion.id.toString() == expected.coordinate }
            if (artifact == null) throw new GradleException('Unresolved pinned dependency: ' + expected.coordinate)
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.file.withInputStream { input -> byte[] buffer = new byte[65536]; int n; while ((n = input.read(buffer)) > 0) digest.update(buffer, 0, n) }
            def hash = digest.digest().encodeHex().toString().toUpperCase(Locale.ROOT)
            if (hash != (expected.publicSha256 ?: expected.sha256)) throw new GradleException('Dependency content differs from lock: ' + expected.coordinate)
            [coordinate: expected.coordinate, sha256: hash]
        }
        def target = layout.buildDirectory.file('dependencies-resolved.json').get().asFile
        target.parentFile.mkdirs(); target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report))
        println('Verified ' + report.size() + ' public dependencies for profile ' + compatibilityProfile)
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'mod_version', project.version
    inputs.property 'jei_min_version', providers.gradleProperty('jeiMinVersion').getOrElse('19.27.0.335')
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version,jei_min_version: providers.gradleProperty('jeiMinVersion').getOrElse('19.27.0.335')) }
}
tasks.register('verifyEditor', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.kubejseditor.EditorVerification'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'verifyEditor', 'verifyPinnedDependencies' }
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.named('jar') { from('LICENSE', 'NOTICE.md') }
tasks.named('sourcesJar') { from('LICENSE', 'NOTICE.md') }
tasks.withType(Jar).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
