name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build from public dependencies
        shell: bash
        run: bash ./gradlew build compileIntegrationJava --no-daemon --console=plain
      - name: Verify empty-workspace migration and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Test-Migration.ps1
          ./scripts/Test-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kubejs-editor-${{ matrix.os }}
          path: |
            build/libs/kubejs-editor-*.jar
            build/dependencies-resolved.json
          if-no-files-found: error
